name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: AlarmyCore tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # AlarmyCore is deliberately free of Apple-framework dependencies, so the
      # entire rule set — scheduling, DST handling, the alarm state machine,
      # Mission Guard and every anti-cheat check — is verifiable on a plain
      # runner without Xcode, a simulator or a provisioning profile.
      - name: Run tests
        working-directory: AlarmyCore
        run: swift test --enable-code-coverage

  project:
    name: iOS SDK build and coordinator tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test without signing
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcodebuild test -project Alarmy.xcodeproj -scheme Alarmy \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize simulator results
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult
          fi
