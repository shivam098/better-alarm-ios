name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: AlarmyCore tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # AlarmyCore is deliberately free of Apple-framework dependencies, so the
      # entire rule set — scheduling, DST handling, the alarm state machine,
      # Mission Guard and every anti-cheat check — is verifiable on a plain
      # runner without Xcode, a simulator or a provisioning profile.
      - name: Run tests
        working-directory: AlarmyCore
        run: swift test --enable-code-coverage

  project:
    name: Xcode project generates
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The app target itself is not built in CI: AlarmKit requires Xcode 26+
      # and an entitlement granted by Apple, neither of which a public runner
      # has. Generation catches project-level mistakes; the app is built locally.
      - name: Verify project was created
        run: test -d Alarmy.xcodeproj
